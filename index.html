<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسيرتي</title>
<meta name="theme-color" content="#0b3d2e">
<link rel="manifest" href="manifest.json">

<style>
:root{
  --bg:#0b1411; --card:#13201a; --card2:#1a2c23; --text:#eaf4ee; --muted:#86a095; --line:#223429;
  --accent:#2fd48a; --accent-text:#04170f; --gold:#f2c14e; --danger:#ef6b5f; --blue:#5aa9ff;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f2f6f3; --card:#ffffff; --card2:#eaf2ed; --text:#12201a; --muted:#5d7167; --line:#dbe6df;
    --accent:#12935c; --accent-text:#ffffff; --gold:#b98700; --danger:#c0392b; --blue:#1f6fc5; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.nm{unicode-bidi:plaintext}
header{padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{margin:0;font-size:22px}
header .hr{display:flex;align-items:center;gap:10px}
.lang{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--accent)}
#main{padding:6px 16px 150px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.hero{background:linear-gradient(135deg,#0d5a41,#0b3d2e);color:#fff;border:0;position:relative;overflow:hidden}
.hero .nmx{font-size:22px;font-weight:800}
.hero .sub{opacity:.85;font-size:14px}
.hero .num{position:absolute;inset-inline-end:14px;top:2px;font-size:70px;font-weight:900;opacity:.14}
.hero select{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff;margin-top:10px}
.hero select option{color:#000}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card2);border-radius:14px;padding:10px 4px;text-align:center}
.tile b{display:block;font-size:24px;line-height:1.2}
.tile span{font-size:12px;color:var(--muted)}
.tile.gold b{color:var(--gold)} .tile.acc b{color:var(--accent)} .tile.red b{color:var(--danger)} .tile.blue b{color:var(--blue)}
.row{display:flex;gap:8px;align-items:center}
.comp{padding:9px 0;border-bottom:1px solid var(--line)}
.comp:last-child{border-bottom:0}
.comp .top{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.comp .top .nm{flex:1}
.comp .nums{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-top:2px}
.comp .nums b{color:var(--text)}
.bar{height:6px;background:var(--card2);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.bd{font-size:12.5px;background:var(--card2);padding:2px 9px;border-radius:10px}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.sh{font-size:14px;font-weight:700;color:var(--accent);margin:16px 4px 8px;display:flex;justify-content:space-between;gap:8px}
.sh span.m{color:var(--muted);font-weight:400;font-size:12.5px}
.empty{text-align:center;color:var(--muted);margin:40px 0}.empty .ic{font-size:46px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tab{flex:1;padding:8px 2px 6px;text-align:center;color:var(--muted);font-size:11.5px}
.tab .i{display:block;font-size:20px;line-height:1.25}
.tab.on{color:var(--accent);font-weight:700}
#fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));inset-inline-end:16px;height:54px;padding:0 20px;border-radius:27px;background:var(--accent);color:var(--accent-text);font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:7}
.btn{display:block;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:700;text-align:center;margin-top:8px}
.btn.p{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.d{color:var(--danger)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btns .btn{margin-top:0;padding:10px 6px;font-size:14px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.sheet .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sheet .hd b{flex:1;font-size:17px}
.sheet .hd button{font-size:20px;padding:4px 10px}
.sheet .bd2{flex:1;overflow-y:auto;padding:14px 16px 40px;max-width:720px;width:100%;margin:0 auto}
.fl{display:block;font-size:13px;color:var(--muted);margin:12px 2px 5px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent);padding:0}
.chk .nm{flex:1;font-size:15px}.chk small{color:var(--muted);font-size:12px}
.chk.big{background:rgba(47,212,138,.1);border-radius:12px;border:1px solid var(--accent);margin-bottom:6px;padding:12px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--card2);border-radius:14px;padding:4px 12px;font-size:13px;display:flex;align-items:center;gap:4px}
.chip button{color:var(--danger);font-size:16px;padding:0 6px}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.a{background:var(--card2);border-radius:14px;padding:10px;opacity:.55}
.a.on{opacity:1;border:1px solid var(--gold);background:rgba(242,193,78,.1)}
.a .ai{font-size:24px}.a .at{font-weight:700;font-size:13.5px}.a .ap{font-size:12px;color:var(--muted)}
.rec{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rec:last-child{border-bottom:0}.rec b{white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:7px 3px;text-align:center;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:600}.tbl td:first-child,.tbl th:first-child{text-align:start}
.banner{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner button{color:var(--accent);font-weight:700;white-space:nowrap}
.trow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}.trow .ti{font-size:26px}.trow .tx{flex:1}.trow .tx b{display:block}
.trow button{padding:6px 10px}
#toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.show{opacity:.96}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.modal .box{background:var(--card);border-radius:16px;padding:18px;max-width:340px;width:100%}
.modal p{margin:0 0 12px;white-space:pre-line}
.welcome{text-align:center;margin:10px 0 16px}.welcome .ic{font-size:54px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.sc h4{margin:0 0 8px;font-size:15px;font-weight:800}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2 label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.g2 input{text-align:center;font-size:20px;font-weight:800;padding:8px}
.stp{display:flex;gap:4px;align-items:center}
.stp button{width:42px;height:46px;border-radius:12px;background:var(--card2);font-size:24px;font-weight:700;flex:none;line-height:1}
.stp button.pl{background:var(--accent);color:var(--accent-text)}
.stp button:active{opacity:.7}
.stp input{padding:8px 2px;min-width:0;flex:1}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.note{background:rgba(242,193,78,.12);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
.tag{font-size:11.5px;padding:1px 8px;border-radius:9px;background:rgba(242,193,78,.18);color:var(--gold);margin-inline-start:6px}
</style>
</head>

      var bt=el('button','btn'+(x.primary?' p':''),x.label);

function blank(){return {v:2,player:null,entries:[],trophies:[],currentEntryId:null,records:{}}}
function cleanStats(s){
  var r=zero();
  if(s&&typeof s==='object')FIELDS.forEach(function(k){r[k]=num(s[k],0)});
  if(r.goals<r.pkS+r.fk)r.goals=r.pkS+r.fk;
  return r;
}
function cleanEntry(x){
  if(!x||typeof x!=='object'||typeof x.label!=='string'||!x.label)return null;
  var comps=[],seen={};
  (Array.isArray(x.comps)?x.comps:[]).forEach(function(c){
    if(c&&typeof c.name==='string'&&c.name&&!seen[c.name]){seen[c.name]=1;comps.push({name:c.name,type:TYPE_ORDER[c.type]!==undefined?c.type:'custom'})}
  });
  var stats={};
  if(x.stats&&typeof x.stats==='object')Object.keys(x.stats).forEach(function(n){
    stats[n]=cleanStats(x.stats[n]);
    if(!seen[n]){seen[n]=1;comps.push({name:n,type:'custom'})}
  });
  if(!comps.length)return null;
  function on(v){return v!=null&&v!==''&&isFinite(Number(v))&&Number(v)>0?Math.floor(Number(v)):null}
  var ca=Number(x.createdAt),ua=Number(x.updatedAt);
  if(!isFinite(ca)||ca<=0)ca=Date.now();if(!isFinite(ua)||ua<=0)ua=ca;
  return {id:typeof x.id==='string'&&x.id?x.id:uid(),label:x.label,club:typeof x.club==='string'?x.club:'',country:country(x.country).id,
    ovrStart:on(x.ovrStart),ovrEnd:on(x.ovrEnd),comps:comps,stats:stats,ended:!!x.ended,createdAt:ca,updatedAt:ua};
}
function cleanTrophy(x){
  if(!x||typeof x!=='object'||typeof x.comp!=='string')return null;
  var ca=Number(x.createdAt);
  return {id:typeof x.id==='string'&&x.id?x.id:uid(),entryId:typeof x.entryId==='string'?x.entryId:'',comp:x.comp,note:typeof x.note==='string'?x.note:'',createdAt:isFinite(ca)&&ca>0?ca:Date.now()};
}
function cleanPlayer(p){
  if(!p||typeof p.name!=='string'||!p.name)return null;
  return {name:p.name,pos:POS.some(function(x){return x[0]===p.pos})?p.pos:'ST',num:p.num!=null&&p.num!==''&&isFinite(Number(p.num))?Number(p.num):null};
}

function convertV1(j){
  var ss=Array.isArray(j.seasons)?j.seasons:[],ms=Array.isArray(j.matches)?j.matches:[];
  var entries=[];
  ss.forEach(function(s){
    if(!s||typeof s.label!=='string')return;
    var stats={};
    (Array.isArray(s.comps)?s.comps:[]).forEach(function(c){if(c&&c.name)stats[c.name]=zero()});
    ms.forEach(function(m){
      if(!m||m.seasonId!==s.id||typeof m.comp!=='string')return;
      var tt=stats[m.comp]||(stats[m.comp]=zero()),g=num(m.goals,0);
      tt.apps++;tt.goals+=g;tt.assists+=num(m.assists,0);if(m.motm)tt.motm++;if(g>=3)tt.hat++;
      tt.pkS+=num(m.pkS,0);tt.pkM+=num(m.pkM,0);tt.fk+=num(m.fk,0);
    });
    var e=cleanEntry({id:s.id,label:s.label,club:s.club,country:s.country,ovrStart:s.ovr,comps:s.comps,stats:stats,createdAt:s.createdAt,updatedAt:Date.now()});
    if(e)entries.push(e);
  });
  var tr=(Array.isArray(j.trophies)?j.trophies:[]).map(function(x){return x?cleanTrophy({id:x.id,entryId:x.seasonId,comp:x.comp,note:x.note,createdAt:x.createdAt}):null}).filter(Boolean);
  return {v:2,player:cleanPlayer(j.player),entries:entries,trophies:tr,currentEntryId:typeof j.currentSeasonId==='string'?j.currentSeasonId:null};
}
function cleanRecords(r){
  var o={};if(!r||typeof r!=='object')return o;
  Object.keys(r).slice(0,300).forEach(function(k){
    var x=r[k];if(!x||typeof x!=='object')return;
    function n(v){v=Math.round(+v);return v>0&&v<100000?v:0}
    var rec={goals:n(x.goals),assists:n(x.assists),allGoals:n(x.allGoals),allAssists:n(x.allAssists),who:typeof x.who==='string'?x.who.slice(0,60):''};
    if(rec.goals||rec.assists||rec.allGoals||rec.allAssists)o[String(k).slice(0,80)]=rec;
  });return o;
}

function hasStats(e,name){var s=e.stats[name];if(!s)return false;return FIELDS.some(function(k){return s[k]>0})}

/* ================= الحسابات ================= */
function rowsOf(entries){
  var rows=[];
  entries.forEach(function(e){
    e.comps.forEach(function(c){var r=Object.assign({comp:c.name,entry:e},st(e,c.name));rows.push(r)});
  });
  return rows;
}
function agg(rows){
  var r=zero();
  rows.forEach(function(x){FIELDS.forEach(function(k){r[k]+=x[k]})});
  r.ga=r.goals+r.assists;return r;
}
function scopeEntries(scope){return scope==='all'?D.entries:D.entries.filter(function(e){return e.label===scope})}
function perComp(rows){
  var map={},order=[];
  rows.forEach(function(x){if(!map[x.comp]){map[x.comp]=[];order.push(x.comp)}map[x.comp].push(x)});
  return order.map(function(n){var a=agg(map[n]);a.name=n;return a}).filter(function(a){return FIELDS.some(function(k){return a[k]>0})})
    .sort(function(a,b){return b.goals-a.goals||b.apps-a.apps});
}
function pct(a,b){return (a+b)?Math.round(a/(a+b)*100)+'%':'—'}
function per(a,n){return n?(Math.round(a/n*100)/100).toString():'—'}

function checkRow(name,sub,checked,disabled,onchange,big,radioName){
  var lab=el('label','chk'+(big?' big':''));
  var cb=document.createElement('input');cb.type=radioName?'radio':'checkbox';if(radioName)cb.name=radioName;
  cb.checked=!!checked;cb.disabled=!!disabled;

  lab.appendChild(cb);lab.appendChild(el('span','nm',name));
  if(sub)lab.appendChild(el('small','',sub));

}
function seasonForm(opts){
  var E=opts.entry,pre=opts.prefill||{};
  var locked={},anyLocked=false;
  if(E)E.comps.forEach(function(c){if(hasStats(E,c.name)){locked[c.name]=1;anyLocked=true}});
  var s={label:E?E.label:(pre.label||''),club:E?E.club:(pre.club||''),country:E?E.country:(pre.country||'eng'),league:'',cups:{},euro:{},custom:[]};
  function defaults(){var c=country(s.country);s.league=c.leagues[0];s.cups={};c.cups.forEach(function(n){s.cups[n]=1})}
  if(E){
    E.comps.forEach(function(c){
      if(c.type==='league')s.league=c.name;else if(c.type==='cup')s.cups[c.name]=1;
      else if(c.type==='euro')s.euro[c.name]=1;else s.custom.push(c.name);
    });
    if(!s.league)defaults();
  }else defaults();

  var w=el('div');
  var lab=mkInput('text',s.label,t('مثال: 2022/23'));lab.oninput=function(){s.label=lab.value};
  var club=mkInput('text',s.club,t('اسم ناديك'));club.oninput=function(){s.club=club.value};
  var cs=mkSelect(COUNTRIES.map(function(c){return [c.id,c.f+' '+t(c.ar)]}),s.country);
  if(anyLocked&&E&&E.comps.some(function(c){return locked[c.name]&&(c.type==='league'||c.type==='cup')}))cs.disabled=true;
  w.appendChild(field(t('الموسم'),lab));w.appendChild(field(t('النادي'),club));
  w.appendChild(field(t('البلد (بتظهر بطولاتها تلقائي)'),cs));
  var box=el('div');w.appendChild(box);

  function draw(){
    box.textContent='';
    var c=country(s.country);
    var lockedLeague=locked[s.league];
    box.appendChild(el('div','fl',t('الدوري')));
    c.leagues.forEach(function(n){
      box.appendChild(checkRow(n,'',s.league===n,lockedLeague&&s.league!==n,function(){s.league=n},false,'lg'));
    });
    if(c.cups.length){
      box.appendChild(el('div','fl',t('الكؤوس المحلية')));
      c.cups.forEach(function(n){
        box.appendChild(checkRow(n,'',!!s.cups[n],!!locked[n],function(v){if(v)s.cups[n]=1;else delete s.cups[n]}));
      });
    }
    box.appendChild(el('div','fl',t('البطولات القارية')));
    EURO.forEach(function(g){
      box.appendChild(el('div','muted small',t(g.g)));
      g.items.forEach(function(it){
        var big=it[0]==='UEFA Champions League';
        box.appendChild(checkRow(it[0],t(it[1]),!!s.euro[it[0]],!!locked[it[0]],function(v){if(v)s.euro[it[0]]=1;else delete s.euro[it[0]]},big));
      });
    });
    box.appendChild(el('div','fl',t('بطولات تانية (اختياري)')));
    var cr=el('div','row'),ci=mkInput('text','',t('اسم بطولة (مثال: كأس مصر)')),cb=el('button','btn p',t('ضيف'));
    cb.style.width='auto';cb.style.marginTop='0';cb.style.padding='10px 18px';
    cb.onclick=function(){
      var n=ci.value.trim();if(!n)return;
      if(s.custom.indexOf(n)===-1)s.custom.push(n);
      ci.value='';draw();
    };
    cr.appendChild(ci);cr.appendChild(cb);box.appendChild(cr);
    var chips=el('div','chips');
    s.custom.forEach(function(n){
      var ch=el('span','chip');ch.appendChild(el('span','nm',n));
      if(!locked[n]){var x=el('button','','✕');x.onclick=function(){s.custom.splice(s.custom.indexOf(n),1);draw()};ch.appendChild(x)}
      chips.appendChild(ch);
    });
    box.appendChild(chips);
  }
  cs.onchange=function(){s.country=cs.value;defaults();draw()};
  draw();

  var b=el('button','btn p',opts.btn||t('حفظ'));
  b.onclick=function(){
    var l=s.label.trim();
    if(!l){toast(t('اكتب اسم الموسم'));return}
    var comps=[{name:s.league,type:'league'}];
    var c=country(s.country);
    c.cups.forEach(function(n){if(s.cups[n])comps.push({name:n,type:'cup'})});
    EURO.forEach(function(g){g.items.forEach(function(it){if(s.euro[it[0]])comps.push({name:it[0],type:'euro'})})});
    s.custom.forEach(function(n){comps.push({name:n,type:'custom'})});
    opts.onSave({label:l,club:s.club.trim(),country:s.country,comps:comps});
  };
  w.appendChild(b);return w;
}

/* ---------- تحديث إحصائيات فترة (النادي في الموسم) ---------- */
function openStats(id){
  var e=entryById(id);if(!e){toast(t('ضيف موسم الأول'));return}
  var w=el('div');
  var c=country(e.country);
  w.appendChild(el('div','',t('{c} — موسم {l}',{c:c.f+' '+(e.club||t('ناديك')),l:e.label})));
  w.firstChild.style.fontWeight='800';
  w.appendChild(el('div','muted small',t('🕒 آخر تحديث: {d}',{d:full(e.updatedAt)})));
  var nt=el('div','note',t('اكتب الإجمالي لحد دلوقتي لكل بطولة (مش الجديد بس). تقدر تحدّثه في أي وقت: آخر الموسم، أو قبل ما تنتقل لنادي تاني.'));
  nt.style.marginTop='10px';w.appendChild(nt);
  var o1=mkInput('number',e.ovrStart==null?'':e.ovrStart,t('أول الموسم')),o2=mkInput('number',e.ovrEnd==null?'':e.ovrEnd,t('آخر الموسم'));
  o1.inputMode=o2.inputMode='numeric';
  var og=el('div','g2');og.appendChild(field(t('تقييم لاعبك OVR أول الموسم'),o1));og.appendChild(field(t('OVR آخر الموسم / دلوقتي'),o2));
  w.appendChild(og);

  var inputs={};
  sortComps(e.comps).forEach(function(cp){
    var card=el('div','sc'),ch4=el('h4','nm',cp.name);card.appendChild(ch4);
    var g=el('div','g2');inputs[cp.name]={};
    var cur=st(e,cp.name),I=inputs[cp.name];
    var gv=function(k){var v=parseInt(I[k].value);return isNaN(v)||v<0?0:v};
    var sv=function(k,v){I[k].value=v};
    var fix=function(k,dir){
      if(dir>0){
        if((k==='pkS'||k==='fk'||k==='hat')&&gv('goals')<Math.max(gv('pkS')+gv('fk'),gv('hat')*3))sv('goals',Math.max(gv('pkS')+gv('fk'),gv('hat')*3));
        if((k==='motm'||k==='hat')&&gv('apps')<gv(k))sv('apps',gv(k));
      }else{
        var minG=Math.max(gv('pkS')+gv('fk'),gv('hat')*3),minA=Math.max(gv('motm'),gv('hat'));
        if(k==='goals'&&gv('goals')<minG)sv('goals',minG);
        if(k==='apps'&&gv('apps')<minA)sv('apps',minA);
      }
    };
    FIELDS.forEach(function(k){
      var d=el('div'),lb=el('label','',t(FL[k])),i=mkInput('number',cur[k]);
      i.inputMode='numeric';i.min=0;i.step=1;
      i.onfocus=function(){try{i.select()}catch(x){}};
      I[k]=i;
      var row=el('div','stp'),mi=el('button','','−'),pl=el('button','pl','+');
      mi.type=pl.type='button';mi.setAttribute('aria-label',t('نقص'));pl.setAttribute('aria-label',t('زوّد'));
      mi.onclick=function(){var v=gv(k);if(v>0){sv(k,v-1);fix(k,-1)}};
      pl.onclick=function(){sv(k,gv(k)+1);fix(k,1)};
      row.appendChild(pl);row.appendChild(i);row.appendChild(mi);
      d.appendChild(lb);d.appendChild(row);g.appendChild(d);
    });
    card.appendChild(g);
    card.appendChild(el('div','muted small',t('دوس + أو − للزيادة والنقصان، أو اكتب الرقم مباشرة. الأهداف = الإجمالي (بيشمل الجزاءات والحرة) وبتتظبط لوحدها.')));
    w.appendChild(card);
  });

  var b=el('button','btn p',t('حفظ الإحصائيات'));
  b.onclick=function(){
    var out={},fixes=[];
    for(var i=0;i<e.comps.length;i++){
      var n=e.comps[i].name,s=zero();
      FIELDS.forEach(function(k){var v=parseInt(inputs[n][k].value);s[k]=isNaN(v)||v<0?0:v});
      if(s.motm>s.apps||s.hat>s.apps){toast(t('في {n}: رجل المباراة والهاتريك لازم يكونوا أقل من أو يساووا المباريات',{n:n}));return}
      var need=Math.max(s.pkS+s.fk,s.hat*3);
      if(s.goals<need){s.goals=need;fixes.push(n)}
      out[n]=s;
    }
    e.stats=out;
    var a=parseInt(o1.value),z=parseInt(o2.value);
    e.ovrStart=isNaN(a)||a<=0?null:a;e.ovrEnd=isNaN(z)||z<=0?null:z;
    e.updatedAt=Date.now();D.currentEntryId=e.id;
    save();
    toast(fixes.length?t('✅ اتحفظت. عدّلت الأهداف في {n} علشان تشمل الجزاءات والهاتريك',{n:fixes.join(lang==='en'?', ':'، ')}):t('✅ اتحفظت الإحصائيات'));
    closeSheet();
  };
  w.appendChild(b);
  openSheet(t('تحديث الإحصائيات'),w);
}

/* ================= نسخ احتياطي ================= */
async function exportBackup(share){
  var data={app:'masera-fifa23',version:2,exportedAt:Date.now(),player:D.player,entries:D.entries,trophies:D.trophies,currentEntryId:D.currentEntryId,records:D.records};
  var blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  var d=new Date();
  var name='masera-backup-'+d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'_'+p2(d.getHours())+'-'+p2(d.getMinutes())+'.json';
  if(share){
    try{
      var f=new File([blob],name,{type:'application/json'});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:t('نسخة مسيرتي')});markBackup();render();return}
    }catch(e){if(e&&e.name==='AbortError')return}
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a)},1500);
  markBackup();toast(t('✅ تم تجهيز النسخة'));render();
}
async function importBackup(file){
  try{
    var j=JSON.parse(await file.text());
    if(!j||typeof j!=='object'||j.app!=='masera-fifa23')throw 0;
    var inc;
    if(j.version===1||Array.isArray(j.seasons))inc=convertV1(j);
    else inc={player:cleanPlayer(j.player),entries:(Array.isArray(j.entries)?j.entries:[]).map(cleanEntry).filter(Boolean),
      trophies:(Array.isArray(j.trophies)?j.trophies:[]).map(cleanTrophy).filter(Boolean),currentEntryId:typeof j.currentEntryId==='string'?j.currentEntryId:null,records:cleanRecords(j.records)};
    if(!inc.entries.length){toast(t('الملف فاضي أو مش نسخة صحيحة'));return}
    var ch=await ask(t('لقيت في النسخة: {e} فترة (موسم/نادي)، {t} لقب.\nتعمل إيه؟',{e:inc.entries.length,t:inc.trophies.length}),[
      {label:t('دمج مع الموجود (الأكثر أمانًا)'),value:'merge',primary:true},
      {label:t('استبدال كل حاجة بالنسخة'),value:'replace',danger:true},
      {label:t('إلغاء'),value:null}]);
    if(!ch)return;
    if(ch==='replace'){
      D={v:2,player:inc.player||D.player,entries:inc.entries,trophies:inc.trophies,currentEntryId:inc.currentEntryId,records:inc.records||{}};
    }else{
      var map={};D.entries.forEach(function(e){map[e.id]=e});
      inc.entries.forEach(function(e){var o=map[e.id];if(!o||e.updatedAt>o.updatedAt)map[e.id]=e});
      D.entries=Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return a.createdAt-b.createdAt});
      var tm={};D.trophies.forEach(function(x){tm[x.id]=x});inc.trophies.forEach(function(x){if(!tm[x.id])tm[x.id]=x});
      D.trophies=Object.keys(tm).map(function(k){return tm[k]});
      if(!D.player&&inc.player)D.player=inc.player;
      D.records=D.records||{};Object.keys(inc.records||{}).forEach(function(k){if(!D.records[k])D.records[k]=inc.records[k]});
    }
    D.entries.sort(function(a,b){return a.createdAt-b.createdAt});
    if(!entryById(D.currentEntryId))D.currentEntryId=D.entries.length?D.entries[D.entries.length-1].id:null;
    scope=null;save();toast(t('✅ تم الاسترجاع'));render();
  }catch(e){toast(t('⚠️ الملف مش نسخة صحيحة'))}
}

  main.appendChild(w);
  var card=el('div','card');
  if(!D.player){
    card.appendChild(el('h3','',t('1️⃣ بيانات لاعبك')));
    card.appendChild(playerForm(null,function(p){D.player=p;save();render()},t('التالي ←')));
  }else{
    card.appendChild(el('h3','',t('2️⃣ أول موسم')));

function applyStatic(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='en'?'ltr':'rtl';
  document.title=t('مسيرتي');
  $('#lang').textContent=lang==='en'?'عربي':'EN';
  $('#fab').textContent=t('✏️ حدّث الإحصائيات');
  var names={home:'الرئيسية',seasons:'المواسم',stats:'إحصائيات',trophies:'الألقاب',settings:'إعدادات'};
  document.querySelectorAll('.tab').forEach(function(b){b.querySelector('.l').textContent=t(names[b.dataset.t])});
}
function setLang(l){
  lang=l==='en'?'en':'ar';
  try{localStorage.setItem(LK,lang)}catch(e){}
  setFormats();applyStatic();
  while(sheets.length){var n=sheets.pop();if(n&&n.parentNode)n.parentNode.removeChild(n)}
  render();
}
function render(){
  var main=$('#main');main.textContent='';
  var ready=D.player&&D.entries.length;
  $('nav').style.display=ready?'flex':'none';
  $('#fab').style.display=(ready&&(tab==='home'||tab==='seasons'))?'block':'none';
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
  $('#sub').textContent='';
  if(!ready){$('#title').textContent=t('مسيرتي');renderWelcome(main);return}
  var titles={home:'مسيرتي',seasons:'المواسم',stats:'الإحصائيات',trophies:'الألقاب',settings:'الإعدادات'};
  $('#title').textContent=t(titles[tab]);
  var s=curEntry();$('#sub').textContent=s?t('موسم {l}',{l:s.label}):'';
  if(tab==='home')renderHome(main);else if(tab==='seasons')renderSeasons(main);
  else if(tab==='stats')renderStats(main);else if(tab==='trophies')renderTrophies(main);else renderSettings(main);
}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){tab=b.dataset.t;render();window.scrollTo(0,0)}});
$('#fab').onclick=function(){var e=curEntry();if(e)openStats(e.id)};
$('#lang').onclick=function(){setLang(lang==='en'?'ar':'en')};
applyStatic();
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
})();
</script>
