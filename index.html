<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسيرتي</title>
<meta name="theme-color" content="#0b3d2e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#0b1411; --card:#13201a; --card2:#1a2c23; --text:#eaf4ee; --muted:#86a095; --line:#223429;
  --accent:#2fd48a; --accent-text:#04170f; --gold:#f2c14e; --danger:#ef6b5f; --blue:#5aa9ff;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f2f6f3; --card:#ffffff; --card2:#eaf2ed; --text:#12201a; --muted:#5d7167; --line:#dbe6df;
    --accent:#12935c; --accent-text:#ffffff; --gold:#b98700; --danger:#c0392b; --blue:#1f6fc5; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.nm{unicode-bidi:plaintext}
header{padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:22px}
#main{padding:6px 16px 150px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.hero{background:linear-gradient(135deg,#0d5a41,#0b3d2e);color:#fff;border:0;position:relative;overflow:hidden}
.hero .nmx{font-size:22px;font-weight:800}
.hero .sub{opacity:.85;font-size:14px}
.hero .num{position:absolute;left:14px;top:2px;font-size:70px;font-weight:900;opacity:.14}
.hero select{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff;margin-top:10px}
.hero select option{color:#000}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card2);border-radius:14px;padding:10px 4px;text-align:center}
.tile b{display:block;font-size:24px;line-height:1.2}
.tile span{font-size:12px;color:var(--muted)}
.tile.gold b{color:var(--gold)} .tile.acc b{color:var(--accent)} .tile.red b{color:var(--danger)} .tile.blue b{color:var(--blue)}
.row{display:flex;gap:8px;align-items:center}
.comp{padding:9px 0;border-bottom:1px solid var(--line)}
.comp:last-child{border-bottom:0}
.comp .top{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.comp .top .nm{flex:1}
.comp .nums{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-top:2px}
.comp .nums b{color:var(--text)}
.bar{height:6px;background:var(--card2);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.bd{font-size:12.5px;background:var(--card2);padding:2px 9px;border-radius:10px}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.sh{font-size:14px;font-weight:700;color:var(--accent);margin:16px 4px 8px;display:flex;justify-content:space-between;gap:8px}
.sh span.m{color:var(--muted);font-weight:400;font-size:12.5px}
.empty{text-align:center;color:var(--muted);margin:40px 0}.empty .ic{font-size:46px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tab{flex:1;padding:8px 2px 6px;text-align:center;color:var(--muted);font-size:11.5px}
.tab .i{display:block;font-size:20px;line-height:1.25}
.tab.on{color:var(--accent);font-weight:700}
#fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:16px;height:54px;padding:0 20px;border-radius:27px;background:var(--accent);color:var(--accent-text);font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:7}
.btn{display:block;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:700;text-align:center;margin-top:8px}
.btn.p{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.d{color:var(--danger)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btns .btn{margin-top:0;padding:10px 6px;font-size:14px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.sheet .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sheet .hd b{flex:1;font-size:17px}
.sheet .hd button{font-size:20px;padding:4px 10px}
.sheet .bd2{flex:1;overflow-y:auto;padding:14px 16px 40px;max-width:720px;width:100%;margin:0 auto}
.fl{display:block;font-size:13px;color:var(--muted);margin:12px 2px 5px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent);padding:0}
.chk .nm{flex:1;font-size:15px}.chk small{color:var(--muted);font-size:12px}
.chk.big{background:rgba(47,212,138,.1);border-radius:12px;border:1px solid var(--accent);margin-bottom:6px;padding:12px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--card2);border-radius:14px;padding:4px 6px 4px 12px;font-size:13px;display:flex;align-items:center;gap:4px}
.chip button{color:var(--danger);font-size:16px;padding:0 6px}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.a{background:var(--card2);border-radius:14px;padding:10px;opacity:.55}
.a.on{opacity:1;border:1px solid var(--gold);background:rgba(242,193,78,.1)}
.a .ai{font-size:24px}.a .at{font-weight:700;font-size:13.5px}.a .ap{font-size:12px;color:var(--muted)}
.rec{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rec:last-child{border-bottom:0}.rec b{white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:7px 3px;text-align:center;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:600}.tbl td:first-child,.tbl th:first-child{text-align:right}
.banner{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner button{color:var(--accent);font-weight:700;white-space:nowrap}
.trow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}.trow .ti{font-size:26px}.trow .tx{flex:1}.trow .tx b{display:block}
.trow button{padding:6px 10px}
#toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.show{opacity:.96}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.modal .box{background:var(--card);border-radius:16px;padding:18px;max-width:340px;width:100%}
.modal p{margin:0 0 12px;white-space:pre-line}
.welcome{text-align:center;margin:10px 0 16px}.welcome .ic{font-size:54px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.sc h4{margin:0 0 8px;font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2 label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.g2 input{text-align:center;font-size:20px;font-weight:800;padding:8px}
.note{background:rgba(242,193,78,.12);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
.tag{font-size:11.5px;padding:1px 8px;border-radius:9px;background:rgba(242,193,78,.18);color:var(--gold);margin-inline-start:6px}
</style>
</head>
<body>
<header><h1 id="title">مسيرتي</h1><span class="muted small" id="sub"></span></header>
<div id="main"></div>
<button id="fab">✏️ حدّث الإحصائيات</button>
<nav>
  <button class="tab" data-t="home"><span class="i">🏠</span>الرئيسية</button>
  <button class="tab" data-t="seasons"><span class="i">📅</span>المواسم</button>
  <button class="tab" data-t="stats"><span class="i">📊</span>إحصائيات</button>
  <button class="tab" data-t="trophies"><span class="i">🏆</span>الألقاب</button>
  <button class="tab" data-t="settings"><span class="i">⚙️</span>إعدادات</button>
</nav>
<div id="toast"></div>

<script>
(function(){
'use strict';
var KEY='masera_fifa23_v2', KEY1='masera_fifa23_v1', BK='masera_fifa23_last_backup';
var $=function(s){return document.querySelector(s)};
var fmtDate=new Intl.DateTimeFormat('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
var fmtTime=new Intl.DateTimeFormat('ar-EG',{hour:'numeric',minute:'2-digit',hour12:true});
function full(t){return fmtDate.format(t)+' — '+fmtTime.format(t)}
function p2(n){return (n<10?'0':'')+n}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined&&text!==null)e.textContent=text;return e}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},3000)}
function ask(msg,buttons){
  return new Promise(function(res){
    var m=el('div','modal'),b=el('div','box');
    b.appendChild(el('p','',msg));
    buttons.forEach(function(x){
      var bt=el('button','btn'+(x.primary?' p':''),x.label);
      if(x.danger)bt.style.color='var(--danger)';
      bt.onclick=function(){document.body.removeChild(m);res(x.value)};
      b.appendChild(bt);
    });
    m.appendChild(b);document.body.appendChild(m);
  });
}
function num(x,def){var n=Number(x);return isFinite(n)&&n>=0?Math.floor(n):def}

/* ================= كتالوج البطولات (FIFA 23) ================= */
var POS=[['ST','مهاجم صريح'],['CF','مهاجم ثاني'],['LW','جناح أيسر'],['RW','جناح أيمن'],['LM','وسط أيسر'],['RM','وسط أيمن'],['CAM','صانع ألعاب'],['CM','وسط'],['CDM','وسط مدافع'],['LB','ظهير أيسر'],['RB','ظهير أيمن'],['CB','قلب دفاع'],['GK','حارس مرمى']];
var COUNTRIES=[
 {id:'eng',f:'🇬🇧',ar:'إنجلترا',leagues:['Premier League','EFL Championship','EFL League One','EFL League Two'],cups:['Emirates FA Cup','Carabao Cup','FA Community Shield']},
 {id:'esp',f:'🇪🇸',ar:'إسبانيا',leagues:['LaLiga Santander','LaLiga SmartBank'],cups:['Copa del Rey','Supercopa de España']},
 {id:'ger',f:'🇩🇪',ar:'ألمانيا',leagues:['Bundesliga','2. Bundesliga','3. Liga'],cups:['DFB-Pokal','DFL-Supercup']},
 {id:'ita',f:'🇮🇹',ar:'إيطاليا',leagues:['Serie A TIM','Serie BKT'],cups:['Coppa Italia','Supercoppa Italiana']},
 {id:'fra',f:'🇫🇷',ar:'فرنسا',leagues:['Ligue 1 Uber Eats','Ligue 2 BKT'],cups:['Coupe de France','Trophée des Champions']},
 {id:'ned',f:'🇳🇱',ar:'هولندا',leagues:['Eredivisie'],cups:['KNVB Beker','Johan Cruijff Schaal']},
 {id:'por',f:'🇵🇹',ar:'البرتغال',leagues:['Liga Portugal bwin'],cups:['Taça de Portugal','Taça da Liga','Supertaça Cândido de Oliveira']},
 {id:'bel',f:'🇧🇪',ar:'بلجيكا',leagues:['Jupiler Pro League'],cups:['Croky Cup','Belgian Super Cup']},
 {id:'sco',f:'🇬🇧',ar:'اسكتلندا',leagues:['cinch Premiership'],cups:['Scottish Cup','Scottish League Cup']},
 {id:'tur',f:'🇹🇷',ar:'تركيا',leagues:['Süper Lig'],cups:['Türkiye Kupası','Süper Kupa']},
 {id:'sau',f:'🇸🇦',ar:'السعودية',leagues:['MBS Pro League'],cups:["King's Cup",'Saudi Super Cup']},
 {id:'usa',f:'🇺🇸',ar:'أمريكا وكندا',leagues:['Major League Soccer'],cups:['MLS Cup Playoffs']},
 {id:'arg',f:'🇦🇷',ar:'الأرجنتين',leagues:['Liga Profesional de Fútbol'],cups:['Copa Argentina','Copa de la Liga Profesional','Supercopa Argentina','Trofeo de Campeones']},
 {id:'aus',f:'🇦🇺',ar:'أستراليا',leagues:['Isuzu UTE A-League'],cups:['Australia Cup']},
 {id:'aut',f:'🇦🇹',ar:'النمسا',leagues:['Admiral Bundesliga'],cups:['ÖFB-Cup']},
 {id:'den',f:'🇩🇰',ar:'الدنمارك',leagues:['3F Superliga'],cups:['Sydbank Pokalen']},
 {id:'nor',f:'🇳🇴',ar:'النرويج',leagues:['Eliteserien'],cups:['Norgesmesterskapet']},
 {id:'swe',f:'🇸🇪',ar:'السويد',leagues:['Allsvenskan'],cups:['Svenska Cupen']},
 {id:'pol',f:'🇵🇱',ar:'بولندا',leagues:['PKO BP Ekstraklasa'],cups:['Puchar Polski','Superpuchar Polski']},
 {id:'irl',f:'🇮🇪',ar:'أيرلندا',leagues:['SSE Airtricity League Premier Division'],cups:['FAI Cup']},
 {id:'rou',f:'🇷🇴',ar:'رومانيا',leagues:['SuperLiga'],cups:['Cupa României','Supercupa României']},
 {id:'sui',f:'🇨🇭',ar:'سويسرا',leagues:['Credit Suisse Super League'],cups:['Swiss Cup']},
 {id:'kor',f:'🇰🇷',ar:'كوريا الجنوبية',leagues:['K League 1'],cups:['Korean FA Cup']},
 {id:'chn',f:'🇨🇳',ar:'الصين',leagues:['Chinese Super League'],cups:['Chinese FA Cup']},
 {id:'ind',f:'🇮🇳',ar:'الهند',leagues:['Hero Indian Super League'],cups:[]}
];
var EURO=[
 {g:'أوروبا (UEFA)',items:[['UEFA Champions League','دوري أبطال أوروبا'],['UEFA Europa League','الدوري الأوروبي'],['UEFA Europa Conference League','دوري المؤتمر الأوروبي'],['UEFA Super Cup','السوبر الأوروبي']]},
 {g:'أمريكا الجنوبية (CONMEBOL)',items:[['CONMEBOL Libertadores','كوبا ليبرتادوريس'],['CONMEBOL Sudamericana','كوبا سودأمريكانا'],['CONMEBOL Recopa','ريكوبا']]},
 {g:'عالمي',items:[['FIFA Club World Cup','كأس العالم للأندية']]}
];
function country(id){for(var i=0;i<COUNTRIES.length;i++)if(COUNTRIES[i].id===id)return COUNTRIES[i];return COUNTRIES[0]}
var TYPE_ORDER={league:0,cup:1,euro:2,custom:3};
function sortComps(list){return list.slice().sort(function(a,b){return (TYPE_ORDER[a.type]||0)-(TYPE_ORDER[b.type]||0)})}

/* الخانات */
var FIELDS=['apps','goals','assists','motm','hat','pkS','pkM','fk'];
var FL={apps:'👟 مباريات',goals:'⚽ أهداف',assists:'🅰️ أسيستات',motm:'⭐ رجل المباراة',hat:'🎩 هاتريك',pkS:'🎯 جزاء سجلته',pkM:'❌ جزاء ضيّعته',fk:'🚀 ضربة حرة سجلتها'};
function zero(){return {apps:0,goals:0,assists:0,motm:0,hat:0,pkS:0,pkM:0,fk:0}}

/* ================= البيانات ================= */
function blank(){return {v:2,player:null,entries:[],trophies:[],currentEntryId:null}}
function cleanStats(s){
  var r=zero();
  if(s&&typeof s==='object')FIELDS.forEach(function(k){r[k]=num(s[k],0)});
  if(r.goals<r.pkS+r.fk)r.goals=r.pkS+r.fk;
  return r;
}
function cleanEntry(x){
  if(!x||typeof x!=='object'||typeof x.label!=='string'||!x.label)return null;
  var comps=[],seen={};
  (Array.isArray(x.comps)?x.comps:[]).forEach(function(c){
    if(c&&typeof c.name==='string'&&c.name&&!seen[c.name]){seen[c.name]=1;comps.push({name:c.name,type:TYPE_ORDER[c.type]!==undefined?c.type:'custom'})}
  });
  var stats={};
  if(x.stats&&typeof x.stats==='object')Object.keys(x.stats).forEach(function(n){
    stats[n]=cleanStats(x.stats[n]);
    if(!seen[n]){seen[n]=1;comps.push({name:n,type:'custom'})}
  });
  if(!comps.length)return null;
  function on(v){return v!=null&&v!==''&&isFinite(Number(v))&&Number(v)>0?Math.floor(Number(v)):null}
  var ca=Number(x.createdAt),ua=Number(x.updatedAt);
  if(!isFinite(ca)||ca<=0)ca=Date.now();if(!isFinite(ua)||ua<=0)ua=ca;
  return {id:typeof x.id==='string'&&x.id?x.id:uid(),label:x.label,club:typeof x.club==='string'?x.club:'',country:country(x.country).id,
    ovrStart:on(x.ovrStart),ovrEnd:on(x.ovrEnd),comps:comps,stats:stats,ended:!!x.ended,createdAt:ca,updatedAt:ua};
}
function cleanTrophy(x){
  if(!x||typeof x!=='object'||typeof x.comp!=='string')return null;
  var ca=Number(x.createdAt);
  return {id:typeof x.id==='string'&&x.id?x.id:uid(),entryId:typeof x.entryId==='string'?x.entryId:'',comp:x.comp,note:typeof x.note==='string'?x.note:'',createdAt:isFinite(ca)&&ca>0?ca:Date.now()};
}
function cleanPlayer(p){
  if(!p||typeof p.name!=='string'||!p.name)return null;
  return {name:p.name,pos:POS.some(function(x){return x[0]===p.pos})?p.pos:'ST',num:p.num!=null&&p.num!==''&&isFinite(Number(p.num))?Number(p.num):null};
}
/* ترحيل من النسخة القديمة (مباراة مباراة) */
function convertV1(j){
  var ss=Array.isArray(j.seasons)?j.seasons:[],ms=Array.isArray(j.matches)?j.matches:[];
  var entries=[];
  ss.forEach(function(s){
    if(!s||typeof s.label!=='string')return;
    var stats={};
    (Array.isArray(s.comps)?s.comps:[]).forEach(function(c){if(c&&c.name)stats[c.name]=zero()});
    ms.forEach(function(m){
      if(!m||m.seasonId!==s.id||typeof m.comp!=='string')return;
      var t=stats[m.comp]||(stats[m.comp]=zero()),g=num(m.goals,0);
      t.apps++;t.goals+=g;t.assists+=num(m.assists,0);if(m.motm)t.motm++;if(g>=3)t.hat++;
      t.pkS+=num(m.pkS,0);t.pkM+=num(m.pkM,0);t.fk+=num(m.fk,0);
    });
    var e=cleanEntry({id:s.id,label:s.label,club:s.club,country:s.country,ovrStart:s.ovr,comps:s.comps,stats:stats,createdAt:s.createdAt,updatedAt:Date.now()});
    if(e)entries.push(e);
  });
  var tr=(Array.isArray(j.trophies)?j.trophies:[]).map(function(t){return t?cleanTrophy({id:t.id,entryId:t.seasonId,comp:t.comp,note:t.note,createdAt:t.createdAt}):null}).filter(Boolean);
  return {v:2,player:cleanPlayer(j.player),entries:entries,trophies:tr,currentEntryId:typeof j.currentSeasonId==='string'?j.currentSeasonId:null};
}
var migrated=false;
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var d=JSON.parse(raw);
      if(d&&typeof d==='object'){
        var b=blank();b.player=d.player||null;b.currentEntryId=d.currentEntryId||null;
        b.entries=(Array.isArray(d.entries)?d.entries:[]).map(cleanEntry).filter(Boolean);
        b.trophies=(Array.isArray(d.trophies)?d.trophies:[]).map(cleanTrophy).filter(Boolean);
        return b;
      }
    }
    var old=localStorage.getItem(KEY1);
    if(old){var o=JSON.parse(old);if(o&&typeof o==='object'){migrated=true;return convertV1(o)}}
  }catch(e){}
  return blank();
}
var D=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));return true}catch(e){toast('⚠️ مفيش مساحة للحفظ! اعمل نسخة احتياطية');return false}}
function lastBackup(){try{return parseInt(localStorage.getItem(BK))||0}catch(e){return 0}}
function markBackup(){try{localStorage.setItem(BK,String(Date.now()))}catch(e){}}
if(migrated)save();

function entryById(id){for(var i=0;i<D.entries.length;i++)if(D.entries[i].id===id)return D.entries[i];return null}
function curEntry(){return entryById(D.currentEntryId)||D.entries[D.entries.length-1]||null}
function labels(){var o=[];D.entries.forEach(function(e){if(o.indexOf(e.label)===-1)o.push(e.label)});return o}
function nextLabel(){
  var last=D.entries[D.entries.length-1];
  if(!last)return '2022/23';
  var m=/(\d{4})\s*\/\s*(\d{2,4})/.exec(last.label||'');
  if(m){var a=(+m[1])+1,b=((+m[2])+1)%100;return a+'/'+p2(b)}
  return '';
}
function st(e,name){var s=e.stats[name];return s?s:zero()}
function hasStats(e,name){var s=e.stats[name];if(!s)return false;return FIELDS.some(function(k){return s[k]>0})}

/* ================= الحسابات ================= */
function rowsOf(entries){
  var rows=[];
  entries.forEach(function(e){
    e.comps.forEach(function(c){var r=Object.assign({comp:c.name,entry:e},st(e,c.name));rows.push(r)});
  });
  return rows;
}
function agg(rows){
  var r=zero();
  rows.forEach(function(x){FIELDS.forEach(function(k){r[k]+=x[k]})});
  r.ga=r.goals+r.assists;return r;
}
function scopeEntries(scope){return scope==='all'?D.entries:D.entries.filter(function(e){return e.label===scope})}
function perComp(rows){
  var map={},order=[];
  rows.forEach(function(x){if(!map[x.comp]){map[x.comp]=[];order.push(x.comp)}map[x.comp].push(x)});
  return order.map(function(n){var a=agg(map[n]);a.name=n;return a}).filter(function(a){return FIELDS.some(function(k){return a[k]>0})})
    .sort(function(a,b){return b.goals-a.goals||b.apps-a.apps});
}
function pct(a,b){return (a+b)?Math.round(a/(a+b)*100)+'%':'—'}
function per(a,n){return n?(Math.round(a/n*100)/100).toString():'—'}

/* ================= الشاشات (Sheets) ================= */
var sheets=[];
function openSheet(title,bodyNode){
  var s=el('div','sheet'),hd=el('div','hd'),x=el('button','','✕');
  x.setAttribute('aria-label','إغلاق');x.onclick=closeSheet;
  hd.appendChild(el('b','',title));hd.appendChild(x);
  var b=el('div','bd2');b.appendChild(bodyNode);
  s.appendChild(hd);s.appendChild(b);
  document.body.appendChild(s);sheets.push(s);
  try{history.pushState({s:sheets.length},'')}catch(e){}
}
function removeTop(){var n=sheets.pop();if(n&&n.parentNode)n.parentNode.removeChild(n);render()}
function closeSheet(){if(!sheets.length)return;try{history.back()}catch(e){removeTop()}}
window.addEventListener('popstate',function(){if(sheets.length)removeTop()});

function field(label,input){var w=el('div');w.appendChild(el('label','fl',label));w.appendChild(input);return w}
function mkInput(type,val,ph){var i=document.createElement('input');i.type=type;if(val!==undefined&&val!==null)i.value=val;if(ph)i.placeholder=ph;return i}
function mkSelect(opts,val){
  var s=document.createElement('select');
  opts.forEach(function(o){var op=document.createElement('option');op.value=o[0];op.textContent=o[1];s.appendChild(op)});
  if(val!==undefined)s.value=val;return s;
}

/* ---------- نموذج اللاعب ---------- */
function playerForm(p,onSave,btnText){
  var w=el('div');
  var nm=mkInput('text',p?p.name:'','اسم لاعبك');
  var pos=mkSelect(POS.map(function(x){return [x[0],x[0]+' — '+x[1]]}),p?p.pos:'ST');
  var nu=mkInput('number',p&&p.num!=null?p.num:'','رقم القميص (اختياري)');nu.inputMode='numeric';
  w.appendChild(field('اسم اللاعب',nm));w.appendChild(field('المركز',pos));w.appendChild(field('رقم القميص',nu));
  var b=el('button','btn p',btnText||'حفظ');
  b.onclick=function(){
    var n=nm.value.trim();if(!n){toast('اكتب اسم اللاعب');return}
    var nv=parseInt(nu.value);
    onSave({name:n,pos:pos.value,num:isNaN(nv)?null:nv});
  };
  w.appendChild(b);return w;
}

/* ---------- نموذج الموسم/النادي والبطولات ---------- */
function checkRow(name,sub,checked,disabled,onchange,big,radioName){
  var lab=el('label','chk'+(big?' big':''));
  var cb=document.createElement('input');cb.type=radioName?'radio':'checkbox';if(radioName)cb.name=radioName;
  cb.checked=!!checked;cb.disabled=!!disabled;
  cb.onchange=function(){onchange(cb.checked)};
  lab.appendChild(cb);lab.appendChild(el('span','nm',name));
  if(sub)lab.appendChild(el('small','',sub));
  return lab;
}
function seasonForm(opts){
  var E=opts.entry,pre=opts.prefill||{};
  var locked={},anyLocked=false;
  if(E)E.comps.forEach(function(c){if(hasStats(E,c.name)){locked[c.name]=1;anyLocked=true}});
  var s={label:E?E.label:(pre.label||''),club:E?E.club:(pre.club||''),country:E?E.country:(pre.country||'eng'),league:'',cups:{},euro:{},custom:[]};
  function defaults(){var c=country(s.country);s.league=c.leagues[0];s.cups={};c.cups.forEach(function(n){s.cups[n]=1})}
  if(E){
    E.comps.forEach(function(c){
      if(c.type==='league')s.league=c.name;else if(c.type==='cup')s.cups[c.name]=1;
      else if(c.type==='euro')s.euro[c.name]=1;else s.custom.push(c.name);
    });
    if(!s.league)defaults();
  }else defaults();

  var w=el('div');
  var lab=mkInput('text',s.label,'مثال: 2022/23');lab.oninput=function(){s.label=lab.value};
  var club=mkInput('text',s.club,'اسم ناديك');club.oninput=function(){s.club=club.value};
  var cs=mkSelect(COUNTRIES.map(function(c){return [c.id,c.f+' '+c.ar]}),s.country);
  if(anyLocked&&E&&E.comps.some(function(c){return locked[c.name]&&(c.type==='league'||c.type==='cup')}))cs.disabled=true;
  w.appendChild(field('الموسم',lab));w.appendChild(field('النادي',club));
  w.appendChild(field('البلد (بتظهر بطولاتها تلقائي)',cs));
  var box=el('div');w.appendChild(box);

  function draw(){
    box.textContent='';
    var c=country(s.country);
    var lockedLeague=locked[s.league];
    box.appendChild(el('div','fl','الدوري'));
    c.leagues.forEach(function(n){
      box.appendChild(checkRow(n,'',s.league===n,lockedLeague&&s.league!==n,function(){s.league=n},false,'lg'));
    });
    if(c.cups.length){
      box.appendChild(el('div','fl','الكؤوس المحلية'));
      c.cups.forEach(function(n){
        box.appendChild(checkRow(n,'',!!s.cups[n],!!locked[n],function(v){if(v)s.cups[n]=1;else delete s.cups[n]}));
      });
    }
    box.appendChild(el('div','fl','البطولات القارية'));
    EURO.forEach(function(g){
      box.appendChild(el('div','muted small',g.g));
      g.items.forEach(function(it){
        var big=it[0]==='UEFA Champions League';
        box.appendChild(checkRow(it[0],it[1],!!s.euro[it[0]],!!locked[it[0]],function(v){if(v)s.euro[it[0]]=1;else delete s.euro[it[0]]},big));
      });
    });
    box.appendChild(el('div','fl','بطولات تانية (اختياري)'));
    var cr=el('div','row'),ci=mkInput('text','','اسم بطولة (مثال: كأس مصر)'),cb=el('button','btn p','ضيف');
    cb.style.width='auto';cb.style.marginTop='0';cb.style.padding='10px 18px';
    cb.onclick=function(){
      var n=ci.value.trim();if(!n)return;
      if(s.custom.indexOf(n)===-1)s.custom.push(n);
      ci.value='';draw();
    };
    cr.appendChild(ci);cr.appendChild(cb);box.appendChild(cr);
    var chips=el('div','chips');
    s.custom.forEach(function(n){
      var ch=el('span','chip');ch.appendChild(el('span','nm',n));
      if(!locked[n]){var x=el('button','','✕');x.onclick=function(){s.custom.splice(s.custom.indexOf(n),1);draw()};ch.appendChild(x)}
      chips.appendChild(ch);
    });
    box.appendChild(chips);
  }
  cs.onchange=function(){s.country=cs.value;defaults();draw()};
  draw();

  var b=el('button','btn p',opts.btn||'حفظ');
  b.onclick=function(){
    var l=s.label.trim();
    if(!l){toast('اكتب اسم الموسم');return}
    var comps=[{name:s.league,type:'league'}];
    var c=country(s.country);
    c.cups.forEach(function(n){if(s.cups[n])comps.push({name:n,type:'cup'})});
    EURO.forEach(function(g){g.items.forEach(function(it){if(s.euro[it[0]])comps.push({name:it[0],type:'euro'})})});
    s.custom.forEach(function(n){comps.push({name:n,type:'custom'})});
    opts.onSave({label:l,club:s.club.trim(),country:s.country,comps:comps});
  };
  w.appendChild(b);return w;
}

/* ---------- تحديث إحصائيات فترة (النادي في الموسم) ---------- */
function openStats(id){
  var e=entryById(id);if(!e){toast('ضيف موسم الأول');return}
  var w=el('div');
  var c=country(e.country);
  w.appendChild(el('div','',c.f+' '+(e.club||'ناديك')+' — موسم '+e.label));
  w.firstChild.style.fontWeight='800';
  w.appendChild(el('div','muted small','🕒 آخر تحديث: '+full(e.updatedAt)));
  var nt=el('div','note','اكتب الإجمالي لحد دلوقتي لكل بطولة (مش الجديد بس). تقدر تحدّثه في أي وقت: آخر الموسم، أو قبل ما تنتقل لنادي تاني.');
  nt.style.marginTop='10px';w.appendChild(nt);
  var o1=mkInput('number',e.ovrStart==null?'':e.ovrStart,'أول الموسم'),o2=mkInput('number',e.ovrEnd==null?'':e.ovrEnd,'آخر الموسم');
  o1.inputMode=o2.inputMode='numeric';
  var og=el('div','g2');og.appendChild(field('تقييم لاعبك OVR أول الموسم',o1));og.appendChild(field('OVR آخر الموسم / دلوقتي',o2));
  w.appendChild(og);

  var inputs={};
  sortComps(e.comps).forEach(function(cp){
    var card=el('div','sc'),ch4=el('h4','nm',cp.name);card.appendChild(ch4);
    var g=el('div','g2');inputs[cp.name]={};
    var cur=st(e,cp.name);
    FIELDS.forEach(function(k){
      var d=el('div'),lb=el('label','',FL[k]),i=mkInput('number',cur[k]);
      i.inputMode='numeric';i.min=0;i.step=1;
      i.onfocus=function(){try{i.select()}catch(x){}};
      d.appendChild(lb);d.appendChild(i);g.appendChild(d);inputs[cp.name][k]=i;
    });
    card.appendChild(g);
    card.appendChild(el('div','muted small','الأهداف = الإجمالي (بيشمل الجزاءات والضربات الحرة)'));
    w.appendChild(card);
  });

  var b=el('button','btn p','حفظ الإحصائيات');
  b.onclick=function(){
    var out={},fixes=[];
    for(var i=0;i<e.comps.length;i++){
      var n=e.comps[i].name,s=zero();
      FIELDS.forEach(function(k){var v=parseInt(inputs[n][k].value);s[k]=isNaN(v)||v<0?0:v});
      if(s.motm>s.apps||s.hat>s.apps){toast('في '+n+': رجل المباراة والهاتريك لازم يكونوا أقل من أو يساووا المباريات');return}
      var need=Math.max(s.pkS+s.fk,s.hat*3);
      if(s.goals<need){s.goals=need;fixes.push(n)}
      out[n]=s;
    }
    e.stats=out;
    var a=parseInt(o1.value),z=parseInt(o2.value);
    e.ovrStart=isNaN(a)||a<=0?null:a;e.ovrEnd=isNaN(z)||z<=0?null:z;
    e.updatedAt=Date.now();D.currentEntryId=e.id;
    save();
    toast(fixes.length?'✅ اتحفظت. عدّلت الأهداف في '+fixes.join('، ')+' علشان تشمل الجزاءات والهاتريك':'✅ اتحفظت الإحصائيات');
    closeSheet();
  };
  w.appendChild(b);
  openSheet('تحديث الإحصائيات',w);
}

/* ================= العرض ================= */
var tab='home',scope=null;
function tile(v,l,cls){var d=el('div','tile'+(cls?' '+cls:''));d.appendChild(el('b','',String(v)));d.appendChild(el('span','',l));return d}
function scopeSelect(){
  var opts=labels().reverse().map(function(l){return [l,'موسم '+l]});
  opts.push(['all','🌟 كل المسيرة']);
  var s=mkSelect(opts,scope);s.onchange=function(){scope=s.value;render()};return s;
}

function entryCard(e,o){
  var c=el('div','card'),cn=country(e.country);
  var t=el('div','');t.style.fontWeight='800';
  t.appendChild(document.createTextNode(cn.f+' '+(e.club||'ناديك')));
  if(e.ended)t.appendChild(el('span','tag','انتقلت منه'));
  c.appendChild(t);
  c.appendChild(el('div','muted small nm',(e.comps.filter(function(x){return x.type==='league'})[0]||{name:''}).name+' • '+e.comps.length+' بطولة'));
  var rows=rowsOf([e]),a=agg(rows);
  var b=el('div','badges');
  [['👟',a.apps],['⚽',a.goals],['🅰️',a.assists],['⭐',a.motm],['🎩',a.hat]].forEach(function(x){b.appendChild(el('span','bd',x[0]+' '+x[1]))});
  c.appendChild(b);
  c.appendChild(el('div','meta','🕒 آخر تحديث: '+full(e.updatedAt)));
  var bt=el('div','btns');
  var u=el('button','btn p','✏️ حدّث الإحصائيات');u.onclick=function(){openStats(e.id)};bt.appendChild(u);
  if(o.latest){var tr=el('button','btn','🔁 انتقال لنادي تاني');tr.onclick=function(){openTransfer(e)};bt.appendChild(tr)}
  if(o.more){
    var ed=el('button','btn','⚙️ تعديل النادي والبطولات');ed.onclick=function(){openEditEntry(e)};bt.appendChild(ed);
    var dl=el('button','btn d','🗑️ مسح');dl.onclick=function(){deleteEntry(e)};bt.appendChild(dl);
  }
  c.appendChild(bt);return c;
}
function openEditEntry(e){
  openSheet('تعديل النادي والبطولات',seasonForm({entry:e,btn:'حفظ التعديل',onSave:function(d){
    e.label=d.label;e.club=d.club;e.country=d.country;e.comps=d.comps;
    var keep={};d.comps.forEach(function(c){keep[c.name]=1});
    Object.keys(e.stats).forEach(function(n){if(!keep[n])delete e.stats[n]});
    scope=null;save();toast('✅ اتحفظ');closeSheet();
  }}));
}
function deleteEntry(e){
  ask('تمسح '+(e.club||'الفترة دي')+' — موسم '+e.label+' بإحصائياتها وألقابها نهائيًا؟',[{label:'امسح',value:true,danger:true},{label:'لا',value:false}]).then(function(ok){
    if(!ok)return;
    D.entries=D.entries.filter(function(x){return x.id!==e.id});
    D.trophies=D.trophies.filter(function(t){return t.entryId!==e.id});
    if(D.currentEntryId===e.id)D.currentEntryId=D.entries.length?D.entries[D.entries.length-1].id:null;
    scope=null;save();render();
  });
}
function openTransfer(e){
  var w=el('div');
  w.appendChild(el('div','note','🔁 انتقال لنادي تاني في نفس الموسم (زي الانتقالات الشتوية). ناديك الحالي ('+(e.club||'—')+') هيتقفل بإحصائياته، وهتبدأ فترة جديدة بالنادي الجديد.'));
  var up=el('button','btn','✏️ لسه ماحدّثتش إحصائيات ناديك الحالي؟ حدّثها الأول');
  up.onclick=function(){closeSheet();setTimeout(function(){openStats(e.id)},120)};
  w.appendChild(up);
  w.appendChild(seasonForm({prefill:{label:e.label,club:'',country:e.country},btn:'تأكيد الانتقال',onSave:function(d){
    if(!d.club){toast('اكتب اسم ناديك الجديد');return}
    e.ended=true;e.updatedAt=e.updatedAt||Date.now();
    var n=cleanEntry({id:uid(),label:d.label,club:d.club,country:d.country,comps:d.comps,stats:{},createdAt:Date.now(),updatedAt:Date.now()});
    D.entries.push(n);D.currentEntryId=n.id;scope=n.label;save();toast('✅ مبروك الانتقال لـ'+d.club);closeSheet();
  }}));
  openSheet('انتقال لنادي تاني',w);
}
function openNewSeason(){
  var last=D.entries[D.entries.length-1]||{};
  openSheet('موسم جديد',seasonForm({prefill:{label:nextLabel(),club:last.club||'',country:last.country||'eng'},btn:'ابدأ الموسم',onSave:function(d){
    var n=cleanEntry({id:uid(),label:d.label,club:d.club,country:d.country,comps:d.comps,stats:{},createdAt:Date.now(),updatedAt:Date.now()});
    D.entries.push(n);D.currentEntryId=n.id;scope=n.label;save();toast('✅ بدأ الموسم '+d.label);closeSheet();
  }}));
}

function renderHome(main){
  var P=D.player,E=curEntry(),ls=labels();
  if(!scope||(scope!=='all'&&ls.indexOf(scope)===-1))scope=E?E.label:'all';
  var hero=el('div','card hero');
  if(P.num!=null)hero.appendChild(el('div','num',String(P.num)));
  hero.appendChild(el('div','nmx',P.name));
  hero.appendChild(el('div','sub',P.pos+' — '+((POS.filter(function(x){return x[0]===P.pos})[0]||['',''])[1])+(E&&E.club?'  •  '+E.club:'')));
  hero.appendChild(scopeSelect());
  main.appendChild(hero);
  var banner=backupBanner();if(banner)main.appendChild(banner);
  if(E){main.appendChild(el('div','sh','النادي الحالي'));main.appendChild(entryCard(E,{latest:true}))}

  var es=scopeEntries(scope),rows=rowsOf(es),a=agg(rows);
  main.appendChild(el('div','sh',scope==='all'?'إجمالي المسيرة':'أرقام موسم '+scope));
  var c=el('div','card'),t=el('div','tiles');
  t.appendChild(tile(a.goals,'⚽ أهداف','acc'));t.appendChild(tile(a.assists,'🅰️ أسيستات','blue'));t.appendChild(tile(a.apps,'👟 مباريات'));
  t.appendChild(tile(a.motm,'⭐ رجل المباراة','gold'));t.appendChild(tile(a.hat,'🎩 هاتريك','gold'));t.appendChild(tile(a.ga,'🤝 أهداف+أسيستات'));
  t.appendChild(tile(a.pkS,'🎯 جزاء سجلته','acc'));t.appendChild(tile(a.pkM,'❌ جزاء ضيّعته','red'));t.appendChild(tile(a.fk,'🚀 ضربات حرة','blue'));
  c.appendChild(t);
  var t2=el('div','tiles');t2.style.marginTop='8px';
  t2.appendChild(tile(per(a.goals,a.apps),'أهداف / مباراة'));
  t2.appendChild(tile(per(a.ga,a.apps),'مساهمات / مباراة'));
  t2.appendChild(tile(pct(a.pkS,a.pkM),'نسبة تسجيل الجزاء'));
  c.appendChild(t2);main.appendChild(c);

  var pc=perComp(rows);
  var cc=el('div','card');cc.appendChild(el('h3','','🏟️ الأهداف في كل بطولة'));
  if(!pc.length)cc.appendChild(el('div','muted small','لسه مدخلتش إحصائيات. دوس "✏️ حدّث الإحصائيات" وسجّل إجماليات كل بطولة مرة واحدة.'));
  var mx=0;pc.forEach(function(x){if(x.goals>mx)mx=x.goals});
  pc.forEach(function(x){
    var r=el('div','comp'),tp=el('div','top');
    tp.appendChild(el('span','nm',x.name));tp.appendChild(el('span','',x.goals+' ⚽'));r.appendChild(tp);
    var n=el('div','nums');
    [['مباريات',x.apps],['أسيست',x.assists],['رجل المباراة',x.motm],['هاتريك',x.hat]].forEach(function(p){
      var s=el('span');s.appendChild(document.createTextNode(p[0]+' '));s.appendChild(el('b','',String(p[1])));n.appendChild(s)});
    r.appendChild(n);
    var bar=el('div','bar'),i=document.createElement('i');i.style.width=(mx?Math.max(3,x.goals/mx*100):0)+'%';bar.appendChild(i);r.appendChild(bar);
    cc.appendChild(r);
  });
  main.appendChild(cc);
  var sh=el('button','btn','📤 شارك إحصائياتي');
  sh.onclick=function(){shareStats(a)};main.appendChild(sh);
}
function shareStats(a){
  var P=D.player;
  var t='⚽ '+P.name+' — مسيرتي في FIFA 23\n'+
   'مباريات: '+a.apps+' | أهداف: '+a.goals+' | أسيستات: '+a.assists+'\n'+
   'رجل المباراة: '+a.motm+' مرة | هاتريك: '+a.hat+'\n'+
   'جزاء سجلته: '+a.pkS+' | جزاء ضيّعته: '+a.pkM+' | ضربات حرة: '+a.fk;
  if(navigator.share){navigator.share({text:t}).catch(function(){})}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('اتنسخ الملخص')},function(){toast('مقدرتش أنسخ')})}
  else toast('المشاركة مش مدعومة هنا');
}
function backupBanner(){
  var lb=lastBackup(),days=lb?Math.floor((Date.now()-lb)/864e5):null;
  var active=agg(rowsOf(D.entries)).apps>0||D.trophies.length>0;
  if(active&&(lb===0||days>=7)){

function simpleTable(head,rows){
  var tb=document.createElement('table');tb.className='tbl';
  var h=document.createElement('tr');head.forEach(function(x){var th=document.createElement('th');th.textContent=x;h.appendChild(th)});tb.appendChild(h);

function renderStats(main){

  var ls=labels().reverse();

    var sc=el('div','card');sc.appendChild(el('h3','','📅 حسب الموسم'));
    var best=null,bestV=0,rws=[];
    ls.forEach(function(l){
      var es=D.entries.filter(function(e){return e.label===l}),a=agg(rowsOf(es));
      if(a.goals>bestV){bestV=a.goals;best=l}
      var o1=null,o2=null;

      es.slice().reverse().forEach(function(e){if(o2==null&&e.ovrEnd)o2=e.ovrEnd});

    });
    sc.appendChild(simpleTable(['الموسم','م','⚽','🅰️','⭐','OVR'],rws));
    if(best)sc.appendChild(el('div','muted small','🌟 أفضل موسم أهداف: '+best+' ('+bestV+' هدف)'));
    main.appendChild(sc);
  }
  var clubs={},co=[];

    var cc=el('div','card');cc.appendChild(el('h3','','🏠 حسب النادي'));

    var rec=el('div','card');rec.appendChild(el('h3','','🏅 أرقام قياسية'));
    function R(l,v){var r=el('div','rec');r.appendChild(el('span','',l));r.appendChild(el('b','',v));rec.appendChild(r)}
    var bg=null,ba=null;

    });

    if(bg)R('أكتر أهداف في بطولة واحدة ('+who(bg)+')',bg.goals+' ⚽');
    if(ba)R('أكتر أسيستات في بطولة واحدة ('+who(ba)+')',ba.assists+' 🅰️');
    var bh=0,bhl='';ls.forEach(function(l){var a=agg(rowsOf(D.entries.filter(function(e){return e.label===l})));if(a.hat>bh){bh=a.hat;bhl=l}});
    if(bh)R('أكتر هاتريك في موسم ('+bhl+')',bh+' 🎩');
    var br=0,brl='';ls.forEach(function(l){var a=agg(rowsOf(D.entries.filter(function(e){return e.label===l})));if(a.apps>=5){var r=a.goals/a.apps;if(r>br){br=r;brl=l}}});
    if(br)R('أفضل معدل أهداف/مباراة ('+brl+')',(Math.round(br*100)/100)+'');
    R('نسبة تسجيل الجزاءات',pct(all.pkS,all.pkM));
    R('عدد المواسم / الأندية',labels().length+' / '+co.filter(function(k){return k!=='—'}).length);

  var ac=el('div','card');ac.appendChild(el('h3','','🎖️ الإنجازات'));

/* ================= نسخ احتياطي ================= */
async function exportBackup(share){
  var data={app:'masera-fifa23',version:2,exportedAt:Date.now(),player:D.player,entries:D.entries,trophies:D.trophies,currentEntryId:D.currentEntryId};
  var blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  var d=new Date();
  var name='masera-backup-'+d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'_'+p2(d.getHours())+'-'+p2(d.getMinutes())+'.json';
  if(share){
    try{
      var f=new File([blob],name,{type:'application/json'});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'نسخة مسيرتي'});markBackup();render();return}
    }catch(e){if(e&&e.name==='AbortError')return}
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a)},1500);
  markBackup();toast('✅ تم تجهيز النسخة');render();
}
async function importBackup(file){
  try{
    var j=JSON.parse(await file.text());
    if(!j||typeof j!=='object'||j.app!=='masera-fifa23')throw 0;
    var inc;
    if(j.version===1||Array.isArray(j.seasons))inc=convertV1(j);
    else inc={player:cleanPlayer(j.player),entries:(Array.isArray(j.entries)?j.entries:[]).map(cleanEntry).filter(Boolean),
      trophies:(Array.isArray(j.trophies)?j.trophies:[]).map(cleanTrophy).filter(Boolean),currentEntryId:typeof j.currentEntryId==='string'?j.currentEntryId:null};
    if(!inc.entries.length){toast('الملف فاضي أو مش نسخة صحيحة');return}
    var ch=await ask('لقيت في النسخة: '+inc.entries.length+' فترة (موسم/نادي)، '+inc.trophies.length+' لقب.\nتعمل إيه؟',[
      {label:'دمج مع الموجود (الأكثر أمانًا)',value:'merge',primary:true},
      {label:'استبدال كل حاجة بالنسخة',value:'replace',danger:true},
      {label:'إلغاء',value:null}]);
    if(!ch)return;
    if(ch==='replace'){
      D={v:2,player:inc.player||D.player,entries:inc.entries,trophies:inc.trophies,currentEntryId:inc.currentEntryId};
    }else{
      var map={};D.entries.forEach(function(e){map[e.id]=e});
      inc.entries.forEach(function(e){var o=map[e.id];if(!o||e.updatedAt>o.updatedAt)map[e.id]=e});
      D.entries=Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return a.createdAt-b.createdAt});
      var tm={};D.trophies.forEach(function(t){tm[t.id]=t});inc.trophies.forEach(function(t){if(!tm[t.id])tm[t.id]=t});
      D.trophies=Object.keys(tm).map(function(k){return tm[k]});
      if(!D.player&&inc.player)D.player=inc.player;
    }
    D.entries.sort(function(a,b){return a.createdAt-b.createdAt});
    if(!entryById(D.currentEntryId))D.currentEntryId=D.entries.length?D.entries[D.entries.length-1].id:null;
    scope=null;save();toast('✅ تم الاسترجاع');render();
  }catch(e){toast('⚠️ الملف مش نسخة صحيحة')}
}
